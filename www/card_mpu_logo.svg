<text x="200" y="95" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" fill="#1c2541">CARD-MPU</text>
<text x="200" y="128" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#3d5a80" letter-spacing="1.5">ATLAS BROWSER</text>
<line x1="200" y1="145" x2="480" y2="145" stroke="#8fb8e3" stroke-width="1"/>
<text x="200" y="168" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6a7d99">Single-nucleus RNA-seq atlas</text>
</svg>

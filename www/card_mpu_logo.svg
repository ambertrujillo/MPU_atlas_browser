<rect x="30" y="30" width="140" height="140" rx="16" fill="#1c2541"/>

<circle cx="75" cy="70" r="5" fill="#8fb8e3"/>
<circle cx="88" cy="62" r="4" fill="#8fb8e3"/>
<circle cx="65" cy="85" r="4" fill="#8fb8e3"/>
<circle cx="95" cy="80" r="5" fill="#8fb8e3"/>
<circle cx="80" cy="95" r="4" fill="#8fb8e3"/>
<circle cx="70" cy="60" r="3" fill="#6a9fd8"/>

<circle cx="130" cy="65" r="5" fill="#b39ce8"/>
<circle cx="142" cy="75" r="4" fill="#b39ce8"/>
<circle cx="120" cy="80" r="4" fill="#b39ce8"/>
<circle cx="135" cy="90" r="5" fill="#b39ce8"/>
<circle cx="148" cy="60" r="3" fill="#8f6fd6"/>
<circle cx="115" cy="68" r="3" fill="#8f6fd6"/>

<circle cx="95" cy="130" r="5" fill="#e8a06a"/>
<circle cx="108" cy="122" r="4" fill="#e8a06a"/>
<circle cx="82" cy="140" r="4" fill="#e8a06a"/>
<circle cx="112" cy="145" r="5" fill="#e8a06a"/>
